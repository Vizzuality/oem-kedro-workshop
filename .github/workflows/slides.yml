name: Deploy slides

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export slides
        working-directory: slides
        run: |
          npx -y @marp-team/marp-cli@4.5.1 --no-stdin --theme vizzuality.css slides.md -o _site/index.html
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/_site

      - id: deployment
        uses: actions/deploy-pages@v4
