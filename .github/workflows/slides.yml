name: Deploy slides

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Export slides
        working-directory: slides
        run: |
          uv run marimo export html-wasm kedro-workshop-slides.py -o _site --mode edit --force
          rm -f _site/CLAUDE.md
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/_site

      - id: deployment
        uses: actions/deploy-pages@v4
