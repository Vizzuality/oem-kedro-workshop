[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"
name = "advanced_example"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "aiohttp>=3.9",
    "fsspec>=2024.6",
    "geopandas>=1.1.4",
    "kedro~=1.7.0",
    "kedro-datasets[geopandas-genericdataset,json-jsondataset,pandas-parquetdataset,pickle-pickledataset]>=9.6.0",
    "kedro-viz>=12.5.0",
    "pyarrow>=25.0.1",
    "rasterio>=1.4.4",
    "scikit-learn>=1.5",
    "zarr>=3.1",
]

[project.scripts]
advanced-example = "advanced_example.__main__:main"

[tool.setuptools.dynamic.version]
attr = "advanced_example.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "advanced_example"
project_name = "advanced-example"
kedro_init_version = "1.7.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/advanced_example -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]


[dependency-groups]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]

[tool.kedro_telemetry]
project_id = "93a2a841686346a480ac91efa709bc36"
