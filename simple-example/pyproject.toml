[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "simple_example"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "geopandas>=1.1.4",
    "kedro~=1.7.0",
    "kedro-datasets[geopandas-genericdataset,polars-csvdataset]>=9.6.0",
    "kedro-viz>=12.5.0",
    "polars>=1.30,<2",
    "pyarrow>=25.0.1",
]

[project.scripts]
simple-example = "simple_example.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]

[tool.setuptools.dynamic.version]
attr = "simple_example.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "simple_example"
project_name = "simple-example"
kedro_init_version = "1.7.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/simple_example -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
]

[tool.kedro_telemetry]
project_id = "56b6b31861ee4110a26e843b7190492f"
